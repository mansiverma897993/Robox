name: Robox checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate

  scan-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Scan deliberately vulnerable Anchor fixture
        run: cargo run -p robox-cli -- scan examples/vulnerable-anchor --format sarif --output robox.sarif
      - name: Assert expected findings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          sarif = json.loads(Path('robox.sarif').read_text(encoding='utf-8'))
          found = {result['ruleId'] for result in sarif['runs'][0]['results']}
          expected = {'RBX001', 'RBX002', 'RBX003', 'RBX004', 'RBX005'}
          assert expected <= found, f'Missing fixture findings: {sorted(expected - found)}'
          print(f'Validated {len(sarif["runs"][0]["results"])} fixture findings')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: robox-fixture-sarif
          path: robox.sarif
