name: Robox security scan
on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p robox-cli -- scan . --format sarif --output robox.sarif --fail-on-score-below 70
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: robox.sarif
